# Cutroom — cutroom.preecursor.com
# Static SPA + /api proxy to the Node agent server on :8787.
# certbot --nginx adds the listen 443 / TLS block and the 80->443 redirect.
server {
    listen 80;
    listen [::]:80;
    server_name cutroom.preecursor.com;

    root /var/www/cutroom/web;
    index index.html;

    # SPA: serve files, fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Agent API → Node server
    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # managed-agent plans can take a while; allow a generous upstream timeout
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # static assets: long cache (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
